[project]
name = "pronunciation-benchmark"
version = "2026.10"
description = "An open benchmark for pronunciation assessment APIs"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "requests>=2.31",
    "rapidfuzz>=3.0",
    "scipy>=1.11",
    "panphon>=0.20",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E741", "E702"]  # short loop names (l, s) and compact counters are deliberate
